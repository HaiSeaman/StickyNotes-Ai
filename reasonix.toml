             <label for=\\\"searchResultCount\\\">每次检索网页条数 (3 ~ 8 条)</label>\n                <div class=\\\"temp-row\\\">\n                    <input type=\\\"range\\\" id=\\\"searchResultCount\\\" min=\\\"3\\\" max=\\\"8\\\" step=\\\"1\\\" value=\\\"5\\\" aria-label=\\\"检索网页条数\\\">\n                    <span class=\\\"temp-value\\\" id=\\\"searchCountValue\\\">5 条</span>\n                </div>\n            </div>\n            <div class=\\\"modal-field\\\" style=\\\"display:flex;gap:8px;align-items:center\\\">\n                <button class=\\\"search-models-btn\\\" id=\\\"testSearchBtn\\\" style=\\\"flex:1;height:32px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px\\\" aria-label=\\\"测试搜索连接\\\"><svg width=\\\"14\\\" height=\\\"14\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1.5\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M22 11.08V12a10 10 0 1 1-5.93-9.14\\\"/><polyline points=\\\"22 4 12 14.01 9 11.01\\\"/></svg>测试搜索连接</button>\n                <button class=\\\"modal-save-btn\\\" id=\\\"searchSaveBtn\\\" style=\\\"flex:1;margin-top:0;height:32px;line-height:32px;padding:0\\\" aria-label=\\\"保存联网设置\\\">保存联网设置</button>\n            </div>\n            <div class=\\\"model-status\\\" id=\\\"searchStatus\\\" role=\\\"status\\\" aria-live=\\\"polite\\\" style=\\\"margin-top:4px\\\"></div>\\`;\n\nconst targetAnchor = '<button class=\\\"modal-save-btn\\\" id=\\\"modalSaveBtn\\\" aria-label=\\\"保存聊天设置\\\">保存聊天设置</button>';\n\nif (!html.includes('id=\\\"searchProvider\\\"')) {\n    html = html.replace(targetAnchor, targetAnchor + '\\n' + searchSettingsHtml);\n    fs.writeFileSync('index.html', html, 'utf8');\n    console.log('Successfully inserted search settings into index.html!');\n} else {\n    console.log('Already contains searchProvider');\n}\n\"", "Bash=node -e \"\nconst fs = require('fs');\nlet code = fs.readFileSync('src/renderer/main.ts', 'utf8');\n\n// 统一类名 chat-citation-badge -> citation-badge\ncode = code.replace(/chat-citation-badge/g, 'citation-badge');\n\n// 修复 renderMessages 中的 sources 渲染\nconst oldRenderMsg = \\\"if (msg.reasoning && msg.role === 'assistant') {\\\";\nconst newRenderMsg = \\`if (msg.role === 'assistant' && msg.sources && msg.sources.length > 0) {\n        const srcDom = buildSourcesDom(msg.sources);\n        if (srcDom) bubbleWrap.appendChild(srcDom);\n    }\n    if (msg.reasoning && msg.role === 'assistant') {\\`;\n\nif (code.includes(oldRenderMsg) && !code.includes('if (msg.role === \\\\'assistant\\\\' && msg.sources')) {\n    code = code.replace(oldRenderMsg, newRenderMsg);\n    console.log('renderMessages patched for sources!');\n}\n\nfs.writeFileSync('src/renderer/main.ts', code, 'utf8');\n\"", "Bash=cat > /tmp/test-fold.mjs << 'EOF'\n// 复刻 main.ts 中的 foldPattern 逻辑测试用户实际粘贴的格式\nconst rawText = `**🔍 已为您搜索：** Hong Kong to Tokyo flight schedule airlines HKG NRT HND, flights Hong Kong to Tokyo August 10 2026 schedule, \"CX548\" \"CX542\" \"CX526\" \"CX504\" HKG Tokyo schedule\n\n**🌐 来源引文：**\n[1] [skyscanner.net](https://vertexaisearch.cloud.google.com/grounding-api-redirect/AAA)\n[2] [flyteam.jp](https://vertexaisearch.cloud.google.com/grounding-api-redirect/BBB)\n[3] [wego.hk](https://vertexaisearch.cloud.google.com/grounding-api-redirect/CCC)\n\n以下是详细航班信息：\n根据搜索结果，CX548 航班在 8月10日 上午 09:30 从香港起飞 [1][2]，下午 14:20 到达东京成田机场 [2]。\n`;\n\nconst foldPattern = /(\\*{0,2}(?:🔍|🌐)\\s*(?:已为您搜索|来源引文|参考来源)[：:]\\*{0,2}[\\s\\S]*?(?=(?:\\n\\*{0,2}(?:🔍|🌐)\\s*(?:已为您搜索|来源引文|参考来源)[：:]|\\n\\n[^\\n]|(?:\\n(?![\\[0-9\\s]))|$)))/g;\n\nconst sections = rawText.split(foldPattern);\nconsole.log('=== split 结果 ===');\nsections.forEach((sec, i) => {\n  if (!sec) return;\n  const preview = sec.length > 80 ? sec.slice(0, 80) + '...' : sec;\n  console.log(`[${i}] (${sec.length} chars): ${JSON.stringify(preview)}`);\n});\n\nconsole.log('\\n=== 折叠判断 ===');\nsections.forEach(sec => {\n  if (!sec) return;\n  if (/^\\*{0,2}🔍\\s*(?:已为您搜索|搜索关键词)[：:]/i.test(sec.trim())) {\n    const lines = sec.trim().split('\\n');\n    const headerText = lines[0].replace(/\\*/g, '').trim();\n    const detailText = lines.slice(1).join('\\n') || headerText;\n    console.log('-> 搜索块 header:', JSON.stringify(headerText));\n    console.log('-> 搜索块 content:', JSON.stringify(detailText.slice(0, 60) + (detailText.length > 60 ? '...' : '')));\n  } else if (/^\\*{0,2}🌐\\s*(?:来源引文|参考来源)[：:]/i.test(sec.trim())) {\n    const lines = sec.trim().split('\\n');\n    const headerText = lines[0].replace(/\\*/g, '').trim();\n    const detailText = lines.slice(1).join('\\n') || headerText;\n    console.log('-> 引文块 header:', JSON.stringify(headerText));\n    console.log('-> 引文块 content:', JSON.stringify(detailText.slice(0, 60) + (detailText.length > 60 ? '...' : '')));\n  } else {\n    console.log('-> 普通正文:', JSON.stringify(sec.slice(0, 50) + (sec.length > 50 ? '...' : '')));\n  }\n});\nEOF\nnode /tmp/test-fold.mjs", "Bash=cd /tmp 2>/dev/null || cd \"$TEMP\"; python -c \"\nimport json, os\nwith open(os.path.expandvars(r'%APPDATA%\\便签\\music\\playlist.json'), encoding='utf-8') as f:\n    pl = json.load(f)\nprint('曲目数:', len(pl))\nif pl:\n    t = pl[0]\n    print('字段:', list(t.keys()))\n    print('示例:', {k: t.get(k) for k in ('title','artist','duration','size','coverPath')})\n    print('首条 filePath 存在:', os.path.isfile(t.get('filePath','')))\ncovers = os.path.expandvars(r'%APPDATA%\\便签\\music\\covers')\nif os.path.isdir(covers):\n    files = os.listdir(covers)\n    print('covers 文件数:', len(files))\n    if files:\n        fp = os.path.join(covers, files[0])\n        print('封面示例:', files[0], os.path.getsize(fp), 'bytes')\n\" 2>&1", "Bash=mkdir -p \"$TEMP/stickynotes-measure\" && cp \"$APPDATA/便签/music/playlist.json\" \"$TEMP/stickynotes-measure/playlist.backup.json\" && echo \"备份完成: $(stat -c%s \"$TEMP/stickynotes-measure/playlist.backup.json\") bytes\" && (tasklist //FI \"IMAGENAME eq electron.exe\" 2>/dev/null | grep -c ele